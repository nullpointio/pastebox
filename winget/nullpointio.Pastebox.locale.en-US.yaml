ShortDescription: Instant, searchable clipboard history for Windows. Offline, no account, nothing on disk unless you pin it.
Description: Pastebox opens a searchable clipboard history over whatever you are doing (Win+Alt+V). It captures text, links,
  images and files, keeps 500 items and lets you pin the ones you reuse. Unpinned history lives in memory only; pinned items
  go to a single plain-text file. No network code in the binary.
