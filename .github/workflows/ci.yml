name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core tests (linux, pure logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (core)
        run: cargo clippy -p pastebox-core --all-targets -- -D warnings
      - name: Test (core)
        run: cargo test -p pastebox-core --release

  windows:
    name: Windows build + tests + smoke
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (whole workspace, incl. Win32 and UI)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (whole workspace)
        run: cargo test --workspace --release

      - name: Build console variant and run smoke + selftest
        shell: pwsh
        run: |
          cargo build --release --features console -p pastebox-app
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          .\target\release\pastebox.exe -smoke
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed: $LASTEXITCODE" }
          .\target\release\pastebox.exe -selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed: $LASTEXITCODE" }

      - name: Build release exe (GUI subsystem)
        shell: pwsh
        run: |
          cargo build --release -p pastebox-app
          if ($LASTEXITCODE -ne 0) { throw "release build failed" }
          Copy-Item target\release\pastebox.exe Pastebox.exe -Force
          $size = (Get-Item Pastebox.exe).Length
          Write-Host "Pastebox.exe = $size bytes"
          # Quality gate: a utility over 10 MB means something heavy got linked in.
          if ($size -gt 10485760) { throw "size gate: $size bytes exceeds the 10 MB ceiling" }

      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path Pastebox.exe -DestinationPath "Pastebox-$ver-win-x64.zip" -Force
          $h = (Get-FileHash Pastebox.exe -Algorithm SHA256).Hash.ToLower()
          $z = (Get-FileHash "Pastebox-$ver-win-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  Pastebox.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          "$z  Pastebox-$ver-win-x64.zip" | Out-File -Encoding ascii -Append SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pastebox-win-x64
          path: |
            Pastebox.exe
            Pastebox-*-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pastebox-win-x64
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          find release -type f -printf '%p %s bytes\n'
          mapfile -t ASSETS < <(find release -type f \( -name 'Pastebox.exe' -o -name '*.zip' -o -name 'SHA256SUMS.txt' \))
          if [ ${#ASSETS[@]} -lt 3 ]; then echo "expected 3 assets, found ${#ASSETS[@]}"; exit 1; fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Pastebox $TAG" \
            --notes-file RELEASE_NOTES.md
